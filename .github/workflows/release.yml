name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - run: make test
      - name: Import personal signing identity
        env:
          SIGNING_P12_BASE64: ${{ secrets.OTP_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.OTP_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_P12_BASE64" || -z "$SIGNING_P12_PASSWORD" ]]; then
            echo "Missing OTP_SIGNING_P12_BASE64 or OTP_SIGNING_P12_PASSWORD secret" >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/otp-signing.p12"
          public_certificate_path="$RUNNER_TEMP/otp-signing.crt"
          keychain_path="$RUNNER_TEMP/otp-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$SIGNING_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          SIGNING_P12_PASSWORD="$SIGNING_P12_PASSWORD" openssl pkcs12 -in "$certificate_path" -passin env:SIGNING_P12_PASSWORD -nokeys -out "$public_certificate_path"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$public_certificate_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          rm -f "$certificate_path"
      - name: Build release artifacts
        run: bash scripts/package-release.sh "${GITHUB_REF_NAME#v}"
      - name: Verify packaged app signature
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/release-check/OTP Grabber.app"
          mkdir -p "$(dirname "$app")"
          ditto -x -k "dist/release/otp-grabber-menubar-macos-$(uname -m).zip" "$(dirname "$app")"
          scripts/verify-menubar-signature.sh "$app" --release
      - name: Delete temporary signing keychain
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/otp-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/otp-signing.p12" "$RUNNER_TEMP/otp-signing.crt"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/release/*.zip dist/release/*.tar.gz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/release/*.zip dist/release/*.tar.gz --generate-notes --verify-tag
          fi
