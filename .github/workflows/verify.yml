name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: make test
      - name: Build native app bundle
        run: bash scripts/build-menubar.sh
      - name: Typecheck Gmail secret importer
        run: swiftc -typecheck scripts/import-gmail-client-secret.swift
      - name: Check shell syntax
        run: find scripts menubar -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check repository hygiene
        run: bash scripts/check-repository.sh
