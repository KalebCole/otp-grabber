name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Run Python, extension, and Swift tests
        run: make test
      - name: Check shell syntax
        run: find scripts agent extension menubar -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check repository hygiene
        run: bash scripts/check-repository.sh
