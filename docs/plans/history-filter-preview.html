<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTP Grabber — History filter preview</title>
<style>
  :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17212b; background: #eef0ed; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .panel { width: min(360px, 100%); padding: 18px; border: 1px solid #dfe4df; border-radius: 18px; background: #fff; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 17px; }
  .settings { color: #3f6655; font-size: 12px; }
  .window { margin: 6px 0 16px; color: #68717a; font-size: 12px; }
  .filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 100%; padding: 4px; border-radius: 11px; background: #f2f4f0; }
  .filters button { min-width: 0; height: 36px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; color: #506057; font: inherit; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: #3f6655; color: #fff; }
  button:focus-visible { outline: 2px solid #3f6655; outline-offset: 2px; }
  .list { display: grid; gap: 10px; margin-top: 16px; }
  article { padding: 14px; border-radius: 12px; background: #f4f6f3; }
  .meta { display: flex; justify-content: space-between; gap: 8px; color: #68717a; font-size: 11px; }
  .meta strong { color: #17212b; font-size: 12px; }
  .code { display: block; margin: 14px 0 9px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 22px; font-weight: 700; letter-spacing: .03em; }
  .actions { display: flex; gap: 18px; }
  .actions button { padding: 0; border: 0; background: none; color: #3f6655; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .actions button:disabled { opacity: .55; cursor: default; }
  .empty { margin: 0; color: #68717a; font-size: 13px; }
  .note { max-width: 360px; margin: 14px auto 0; color: #68717a; font-size: 11px; line-height: 1.5; }
</style>
<main>
  <section class="panel" aria-label="OTP Grabber history preview">
    <header><h1>History</h1><span class="settings">Settings</span></header>
    <p class="window">Last 24 hours</p>
    <div class="filters" role="group" aria-label="Filter history by source">
      <button type="button" data-source="all" aria-pressed="true">All</button>
      <button type="button" data-source="gmail" aria-pressed="false">Gmail</button>
      <button type="button" data-source="messages" aria-pressed="false">Messages</button>
    </div>
    <div class="list" id="history-list" aria-live="polite"></div>
  </section>
  <p class="note">Illustrative codes. This preview demonstrates the filter layout and behavior; Gmail links are not connected.</p>
</main>
<script>
  const records = [
    { source: "gmail", service: "GitHub", age: "31 min ago", code: "194 802" },
    { source: "messages", service: "Bank alert", age: "Yesterday", code: "830 216" },
  ];
  const buttons = [...document.querySelectorAll("[data-source]")];
  const list = document.querySelector("#history-list");

  function render(source) {
    buttons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.source === source)));
    list.replaceChildren();
    const visible = records.filter(record => source === "all" || record.source === source);
    if (!visible.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = `No ${source} codes in the last 24 hours.`;
      list.append(empty);
      return;
    }
    for (const record of visible) {
      const card = document.createElement("article");
      const meta = document.createElement("div");
      meta.className = "meta";
      const service = document.createElement("strong");
      service.textContent = `${record.service} · ${record.source === "gmail" ? "Gmail" : "Messages"}`;
      const age = document.createElement("span");
      age.textContent = record.age;
      meta.append(service, age);
      const code = document.createElement("span");
      code.className = "code";
      code.textContent = record.code;
      const actions = document.createElement("div");
      actions.className = "actions";
      const copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "Copy";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(record.code.replaceAll(" ", ""));
          copy.textContent = "Copied";
        } catch {
          copy.textContent = "Copy unavailable";
        }
      });
      actions.append(copy);
      if (record.source === "gmail") {
        const link = document.createElement("button");
        link.type = "button";
        link.textContent = "Open in Gmail";
        link.title = "Illustrative preview; no Gmail account is connected";
        link.disabled = true;
        actions.append(link);
      }
      card.append(meta, code, actions);
      list.append(card);
    }
  }

  buttons.forEach(button => button.addEventListener("click", () => render(button.dataset.source)));
  render("all");
</script>
</html>
